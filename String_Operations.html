<!DOCTYPE html>
<html>

<head>
    <title>String Operations</title>
</head>

<body>
    <h2>1. Reverse String</h2>
    <input type="text" id="reverseInput" placeholder="Enter string">
    <button onclick="reverseString()">Reverse</button>
    <p id="reverseResult"></p>

    <h2>2. Replace Character</h2>
    <input type="text" id="replaceString" placeholder="Enter string">
    <input type="text" id="oldChar" placeholder="Old character" maxlength="1">
    <input type="text" id="newChar" placeholder="New character" maxlength="1">
    <button onclick="replaceCharacter()">Replace</button>
    <p id="replaceResult"></p>

    <h2>3. Check Palindrome</h2>
    <input type="text" id="palindromeInput" placeholder="Enter string">
    <button onclick="checkPalindrome()">Check</button>
    <p id="palindromeResult"></p>

    <script src="String_Operations.js"></script>
</body>

</html>
